# 云策 YunCe —— Nginx 反向代理
#
# 用法：
#   1) cp deploy/nginx-yunce.conf /etc/nginx/conf.d/yunce.conf
#   2) 把 ops.example.com 全部换成你的域名（没有域名就用 _）
#   3) nginx -t && systemctl reload nginx        # 先跑通 80
#   4) certbot --nginx -d ops.example.com        # certbot 会基于本段自动生成 443 孪生段
#      证书齐全后它还会顺手加上 80->443 跳转，下面的 HTTPS 段仅作参考/手工配置用
#
# 三个必须项（别删）：
#   1) client_max_body_size >= 后端 MAX_CONTENT_LENGTH(160MB)，否则视频上传 413
#   2) proxy_buffering off：扫码登录 / 私信同步是 SSE 长连接，缓冲会把二维码卡死
#   3) proxy_read_timeout 拉长：发布任务同步等待可能好几分钟，默认 60s 会 504

upstream yunce_backend {
    server 127.0.0.1:5409;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ops.example.com;

    # certbot --webroot 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 视频素材上限（后端 160MB）
    client_max_body_size 200m;
    client_body_timeout  600s;

    access_log /var/log/nginx/yunce.access.log;
    error_log  /var/log/nginx/yunce.error.log warn;

    # 健康检查只给本机；/health/ready 做就绪判定（P0-5：Docker HEALTHCHECK + Nginx upstream 用）
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://yunce_backend;
        access_log off;
    }
    location = /health/ready {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://yunce_backend;
        access_log off;
    }

    location / {
        proxy_pass http://yunce_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # 大文件上传：不要先落盘再转发
        proxy_request_buffering off;

        # SSE（/login 扫码、进度流）必须关缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 想额外加一层 HTTP Basic Auth 就打开下面三行（和内置 YUNCE_ACCESS_TOKEN 不冲突）
    # auth_basic "YunCe";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}

