# P0-5：Nginx 接入 /health/ready 做 upstream 健康判定
upstream yunce_backend {
    server 127.0.0.1:5409 max_fails=2 fail_timeout=30s;
}
server {
    listen 80;
    location /health/ready {
        proxy_pass http://yunce_backend/health/ready;
        proxy_connect_timeout 4s;
        proxy_read_timeout 5s;
    }
    location / {
        proxy_pass http://yunce_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
